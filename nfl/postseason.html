<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Postseason</title><style>body{margin:0;background:#0b1220;color:#edf4ff;font:14px system-ui}.wrap{max-width:1200px;margin:auto;padding:22px}a{color:#bcd5ff}.nav{display:flex;gap:12px;flex-wrap:wrap}.round{margin-top:20px;background:#111c2f;border:1px solid #2c3c56;border-radius:14px;padding:15px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.g{background:#17243a;border-radius:10px;padding:12px}.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.post-team{display:flex;align-items:center;gap:7px;font-weight:700}.post-team.home{justify-content:flex-end;text-align:right}.post-logo{width:34px;height:34px;object-fit:contain;flex:0 0 34px}.pick-team{display:inline-flex;align-items:center;gap:6px}.pick-logo{width:22px;height:22px;object-fit:contain}.at{color:#9fb0c7;font-weight:700}.muted{color:#9fb0c7}.result{margin-top:8px;padding:8px;border-radius:8px;background:#0c1627}.good{color:#39d98a}.bad{color:#ff6b6b}.neutral{color:#9fb0c7}</style></head><body><div class="wrap"><div class="nav"><a href="index.html">All Years</a><a href="2021-plus.html">2021+</a><a href="reward.html">Reward</a><a href="comparison.html">Comparison</a><a href="savant.html">Savant</a><a href="../mlb/index.html">MLB</a></div><h1>NFL Postseason</h1><p class="muted">Wild Card → Divisional → Conference Championships → Super Bowl. Uses the NFL Savant model for scheduled playoff games.</p><div id="content">Loading…</div></div><script>const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const teamSlug=name=>String(name??'').toLowerCase().replace(/&/g,'and').replace(/[.’'`]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');function logo(team,cls='post-logo'){let s=teamSlug(team);return s?`<img class="${cls}" src="logos/${s}.png" alt="" loading="lazy" onerror="this.style.display='none'">`:'';}async function load(){try{let r=await fetch('postseason.json?_='+Date.now());let p=await r.json();if(!p.active){content.innerHTML='<div class="round">Postseason mode is inactive during the regular season.</div>';return}let rounds=p.rounds||{};content.innerHTML=Object.entries(rounds).map(([name,games])=>`<div class="round"><h2>${e(name)}</h2><div class="games">${games.map(g=>`<div class="g"><div class="matchup"><div class="post-team">${logo(g.away_team)}<span>${e(g.away_team)}</span></div><span class="at">@</span><div class="post-team home">${logo(g.home_team)}<span>${e(g.home_team)}</span></div></div><p>Pick: <strong class="pick-team">${logo(g.predicted_winner,'pick-logo')}${e(g.predicted_winner)}</strong> · ${(100*Number(g.prediction_confidence||0)).toFixed(1)}%</p><span class="muted">${e(g.game_status||g.status_detail||g.gameday)}</span>${g.is_final?`<div class="result"><b>Final:</b> ${e(g.away_team)} ${g.actual_away_score??g.away_score??'—'} - ${g.actual_home_score??g.home_score??'—'} ${e(g.home_team)}<br><b>Winner:</b> ${g.actual_winner?logo(g.actual_winner,'pick-logo'):''}${e(g.is_tie?'Tie':(g.actual_winner||'Unavailable'))}${g.prediction_result==='correct'?'<br><span class="good">Pick correct</span>':g.prediction_result==='incorrect'?'<br><span class="bad">Pick incorrect</span>':'<br><span class="neutral">Prediction not graded</span>'}</div>`:''}</div>`).join('')}</div></div>`).join('')}catch(e){content.textContent='No postseason data exported yet.'}}load();setInterval(load,60000)</script></body></html>
