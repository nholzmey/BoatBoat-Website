<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Postseason</title><style>body{margin:0;background:#0b1220;color:#edf4ff;font:14px system-ui}.wrap{max-width:1200px;margin:auto;padding:22px}a{color:#bcd5ff}.nav{display:flex;gap:12px;flex-wrap:wrap}.round{margin-top:20px;background:#111c2f;border:1px solid #2c3c56;border-radius:14px;padding:15px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.g{background:#17243a;border-radius:10px;padding:12px}.muted{color:#9fb0c7}</style></head><body><div class="wrap"><div class="nav"><a href="index.html">All Years</a><a href="2021-plus.html">2021+</a><a href="reward.html">Reward</a><a href="comparison.html">Comparison</a><a href="savant.html">Savant</a><a href="../mlb/index.html">MLB</a></div><h1>NFL Postseason</h1><p class="muted">Wild Card → Divisional → Conference Championships → Super Bowl. Uses the NFL Savant model for scheduled playoff games.</p><div id="content">Loading…</div></div><script>const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){try{let r=await fetch('postseason.json?_='+Date.now());let p=await r.json();if(!p.active){content.innerHTML='<div class="round">Postseason mode is inactive during the regular season.</div>';return}let rounds=p.rounds||{};content.innerHTML=Object.entries(rounds).map(([name,games])=>`<div class="round"><h2>${e(name)}</h2><div class="games">${games.map(g=>`<div class="g"><b>${e(g.away_team)} @ ${e(g.home_team)}</b><p>Pick: <strong>${e(g.predicted_winner)}</strong> · ${(100*Number(g.prediction_confidence||0)).toFixed(1)}%</p><span class="muted">${e(g.status_detail||g.gameday)}</span></div>`).join('')}</div></div>`).join('')}catch(e){content.textContent='No postseason data exported yet.'}}load();setInterval(load,60000)</script></body></html>
