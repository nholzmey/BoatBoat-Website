<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Model Comparison — NFL</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2f;--panel2:#17243a;--text:#ecf3ff;--muted:#9fb0c7;--good:#39d98a;--warn:#f4c95d;--bad:#ff6b6b;--line:#2b3b55;--accent:#62a8ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08101d,#0e1728 35%,#0b1220);color:var(--text);font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:22px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:var(--text);text-decoration:none;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#0e1829}.nav a.active{background:#203657;border-color:#4c78aa}.headline{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}.headline h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:5px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.metric b{display:block;font-size:20px;margin-top:3px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 6px 22px #0004}.card.qualified{border-color:var(--good)}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.team:last-child{text-align:right}.team strong{font-size:17px}.team-name{display:flex;align-items:center;gap:9px;min-height:40px}.team:last-child .team-name{justify-content:flex-end}.team-logo{width:38px;height:38px;object-fit:contain;flex:0 0 38px;filter:drop-shadow(0 2px 4px #0008)}.pick-winner{display:inline-flex;align-items:center;gap:7px}.pick-logo{width:24px;height:24px;object-fit:contain;flex:0 0 24px;vertical-align:middle}.score{font-size:24px;font-weight:700;text-align:center}.status{font-size:12px;color:var(--muted);text-align:center}.pick{margin-top:12px;background:var(--panel2);border-radius:10px;padding:11px}.pick strong{font-size:17px}.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;margin-left:6px}.tag.good{background:#123d2d;color:#8cf0ba}.tag.warn{background:#463d19;color:#ffe59a}.tag.gray{background:#26364e;color:#b9c8dc}.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.pill{background:#0c1627;border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}.small{font-size:12px;color:var(--muted)}.bet{margin-top:9px;padding:8px;border-left:3px solid var(--accent);background:#0c1627}.gate{margin-top:10px}.gate-row{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;margin:6px 0}.bar{height:8px;background:#273750;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--accent)}.pass{color:var(--good)}.fail{color:var(--bad)}.models{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:15px;margin-top:22px}.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.chart img{width:100%;border-radius:8px}.empty{padding:30px;color:var(--muted);text-align:center}.footer{height:40px}@media(max-width:600px){.games,.charts{grid-template-columns:1fr}.wrap{padding:12px}.gate-row{grid-template-columns:95px 1fr auto}}
.result-panel{margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0c1627}.result-panel.final{border-left:4px solid var(--accent)}.result-panel.correct{border-left-color:var(--good)}.result-panel.incorrect{border-left-color:var(--bad)}.result-panel.unscored{border-left-color:var(--muted)}.result-panel.live{border-left-color:var(--warn)}.winner-line{display:flex;align-items:center;gap:7px;margin-top:4px}.winner-line .pick-logo{width:22px;height:22px}.result-badge{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:800}.result-badge.correct{background:#123d2d;color:#8cf0ba}.result-badge.incorrect{background:#4a2328;color:#ff9a9a}.result-badge.unscored{background:#26364e;color:#b9c8dc}.result-badge.tie{background:#463d19;color:#ffe59a}</style></head>
<body><div class="wrap">
<div class="nav">
<a href="index.html" data-k="all_years">All Years</a><a href="2021-plus.html" data-k="recent">2021+</a><a href="reward.html" data-k="reward">Reward</a><a href="comparison.html" data-k="comparison">Comparison</a><a href="savant.html" data-k="savant">Savant Fusion</a><a href="postseason.html">Postseason</a><a href="../mlb/index.html">MLB</a>
</div>
<div class="headline"><div><h1>NFL Model Comparison</h1><div class="sub" id="subtitle">Loading NFL week…</div></div><div class="small">Weekly predictions • Daily refresh • Minute updates on game days</div></div>
<div class="summary" id="summary"></div><div class="games" id="games"></div>
<div class="charts">
<div class="chart"><h2>Accuracy by Week</h2><img src="charts/accuracy_comparison.png" onerror="this.parentElement.style.display='none'"></div>
<div class="chart"><h2>$100 Strategy — Cumulative P/L</h2><img src="charts/betting_comparison.png" onerror="this.parentElement.style.display='none'"></div>
<div class="chart"><h2>Team Prediction Accuracy</h2><img src="charts/team_accuracy_comparison.png" onerror="this.parentElement.style.display='none'"></div>

</div><div class="footer"></div></div>
<script>
const MODEL_KEY="comparison";
document.querySelector(`[data-k="${MODEL_KEY}"]`)?.classList.add('active');
const pct=x=>x==null?'—':(Number(x)*100).toFixed(1)+'%';const money=x=>x==null?'—':(Number(x)>0?'+':'')+Number(x);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teamSlug=name=>String(name??'').toLowerCase().replace(/&/g,'and').replace(/[.’'`]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
function teamLogo(team,cls='team-logo'){const slug=teamSlug(team);return slug?`<img class="${cls}" src="logos/${slug}.png" alt="" loading="lazy" onerror="this.style.display='none'">`:'';}
function gateHtml(g){if(MODEL_KEY!=='savant')return'';const q=g.qualification_gate||{};const rows=[['Confidence',g.prediction_confidence,q.confidence_threshold,false],['Reliability',g.reliability_score,q.reliability_threshold,false],['Disagreement',g.expert_disagreement,q.max_expert_std,true],['Completeness',g.feature_completeness,q.min_feature_completeness,false]];return `<div class="gate"><b>Qualification gap</b>${rows.map(([n,v,t,inverse])=>{v=Number(v??0);t=Number(t??0);const pass=inverse?v<=t:v>=t;const delta=Math.abs(v-t)*100;const msg=pass?'passes':`${inverse?'over':'short'} ${delta.toFixed(1)} pts`;const width=Math.min(100,(inverse?(t/Math.max(v,t,.001)):(v/Math.max(t,.001)))*100);return `<div class="gate-row"><span>${n}</span><div class="bar"><span style="width:${width}%"></span></div><span class="${pass?'pass':'fail'}">${pct(v)} / ${inverse?'max ':''}${pct(t)} · ${msg}</span></div>`}).join('')}</div>`}
function comparisonHtml(g){if(MODEL_KEY!=='comparison')return'';const p=g.model_picks||{};return `<div class="models"><div class="pill">All Years<br><b>${esc(p.all_years)}</b></div><div class="pill">2021+<br><b>${esc(p.recent)}</b></div><div class="pill">Reward<br><b>${esc(p.reward)}</b></div></div>`}
function betHtml(g){let txt='Waiting for a FanDuel line.';if(g.simulated_bet_team)txt=`$${Number(g.simulated_bet_stake||100).toFixed(0)} on ${esc(g.simulated_bet_team)} at ${money(g.simulated_bet_moneyline)} · ${esc(g.simulated_bet_status||'pending')}${g.simulated_bet_profit_loss!=null?` · P/L $${Number(g.simulated_bet_profit_loss).toFixed(2)}`:''}`;return `<div class="bet"><b>Simulated straight bet:</b> ${txt}</div>`}
function resultHtml(g){
  const awayScore=g.actual_away_score??g.away_score;
  const homeScore=g.actual_home_score??g.home_score;
  const hasScore=awayScore!==null&&awayScore!==undefined&&homeScore!==null&&homeScore!==undefined;
  if(g.is_final){
    let cls='unscored',badge='<span class="result-badge unscored">NOT SCORED</span>';
    if(g.prediction_result==='correct'||g.prediction_correct===true){cls='correct';badge='<span class="result-badge correct">PICK CORRECT</span>'}
    else if(g.prediction_result==='incorrect'||g.prediction_correct===false){cls='incorrect';badge='<span class="result-badge incorrect">PICK INCORRECT</span>'}
    else if(g.prediction_result==='tie'||g.is_tie){cls='unscored';badge='<span class="result-badge tie">TIE</span>'}
    const winner=g.actual_winner;
    const winnerText=g.is_tie?'Tie':(winner||'Winner unavailable');
    const note=g.prediction_result==='backfilled_not_scored'?'<div class="small">Prediction not graded because this game was first captured after kickoff.</div>':'';
    return `<div class="result-panel final ${cls}"><div><b>Final:</b> ${esc(g.away_team)} ${hasScore?awayScore:'—'} - ${hasScore?homeScore:'—'} ${esc(g.home_team)} ${badge}</div><div class="winner-line"><b>Winner:</b> ${winner?teamLogo(winner,'pick-logo'):''}<strong>${esc(winnerText)}</strong></div>${note}</div>`;
  }
  if(g.is_live){
    const leader=g.current_leader||((hasScore&&awayScore===homeScore)?'Tied':'');
    return `<div class="result-panel live"><div><b>Live:</b> ${esc(g.away_team)} ${hasScore?awayScore:'—'} - ${hasScore?homeScore:'—'} ${esc(g.home_team)}</div>${leader?`<div><b>Current leader:</b> ${esc(leader)}</div>`:''}</div>`;
  }
  return '';
}
function card(g){const tag=MODEL_KEY==='savant'?(g.is_qualified_pick?'<span class="tag good">QUALIFIED ≥65%</span>':'<span class="tag warn">PICK — BELOW QUALIFIED GATE</span>'):(MODEL_KEY==='comparison'?`<span class="tag ${g.agreement_count===3?'good':'warn'}">${g.agreement_count}/3 AGREEMENT</span>`:'');return `<div class="card ${g.is_qualified_pick?'qualified':''}"><div class="teams"><div class="team"><div class="team-name">${teamLogo(g.away_team)}<strong>${esc(g.away_team)}</strong></div><div class="small">Away</div></div><div><div class="score">${g.away_score??'—'} - ${g.home_score??'—'}</div><div class="status">${esc(g.game_status||g.status_detail||g.gameday||'Scheduled')}</div></div><div class="team"><div class="team-name">${teamLogo(g.home_team)}<strong>${esc(g.home_team)}</strong></div><div class="small">Home</div></div></div><div class="pick"><div>Pick ${tag}</div><strong class="pick-winner">${teamLogo(g.predicted_winner,'pick-logo')}${esc(g.predicted_winner)}</strong> · ${pct(g.prediction_confidence)} confidence<div class="small">Home win ${pct(g.home_win_probability)} · Away win ${pct(g.away_win_probability)}</div></div>${resultHtml(g)}${comparisonHtml(g)}${gateHtml(g)}<div class="odds"><div class="pill"><span class="small">Away ML</span><br><b>${money(g.current_away_moneyline)}</b></div><div class="pill"><span class="small">Home ML</span><br><b>${money(g.current_home_moneyline)}</b></div><div class="pill"><span class="small">Total</span><br><b>${g.current_total??'—'}</b></div></div>${betHtml(g)}</div>`}
async function load(){try{const r=await fetch(`week_predictions_${MODEL_KEY}.json?_=${Date.now()}`);if(!r.ok)throw Error('missing');const p=await r.json();const games=p.games||[];document.getElementById('subtitle').textContent=`${p.season} · Week ${p.week} · ${p.game_type} · updated ${new Date(p.generated_at).toLocaleString()}`;const q=games.filter(g=>g.is_qualified_pick).length;const graded=games.filter(g=>g.prediction_result==='correct'||g.prediction_result==='incorrect');const correct=graded.filter(g=>g.prediction_result==='correct').length;document.getElementById('summary').innerHTML=`<div class="metric">Games<b>${games.length}</b></div><div class="metric">Completed<b>${games.filter(g=>g.is_final).length}</b></div><div class="metric">Live<b>${games.filter(g=>g.is_live).length}</b></div><div class="metric">Graded finals<b>${graded.length}</b></div><div class="metric">Correct<b>${correct}</b></div>${MODEL_KEY==='savant'?`<div class="metric">Qualified<b>${q}</b></div><div class="metric">Holdout target<b>${p.qualification_target_met?'Passed':'Disabled'}</b></div>`:''}`;document.getElementById('games').innerHTML=games.length?games.map(card).join(''):'<div class="empty">No games in the active NFL week.</div>';}catch(e){document.getElementById('games').innerHTML='<div class="empty">NFL predictions have not been exported yet.</div>'}}
load();setInterval(load,60000);
</script></body></html>
