<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB Predictions — Postseason Mode</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #0f172a;
      color: #e5e7eb;
    }
    a { color: inherit; }
    .nav-link {
      display: inline-block;
      margin-bottom: 14px;
      color: #60a5fa;
      text-decoration: none;
      font-weight: bold;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .tabs {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }
    .tab {
      background: #1d4ed8;
      border: 1px solid #60a5fa;
      border-radius: 8px;
      padding: 10px 13px;
      text-decoration: none;
      font-weight: bold;
    }
    .tab.active {
      background: #7c3aed;
      border-color: #c4b5fd;
    }
    .status, .note, .inactive {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      background: #111827;
      border: 1px solid #334155;
      line-height: 1.5;
    }
    .inactive {
      border-color: #64748b;
      color: #cbd5e1;
    }
    .overall-card, .series-card, .history-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
    .overall-card { margin-bottom: 22px; }
    .overall-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .favorite {
      padding: 10px 12px;
      border-radius: 10px;
      background: #052e1b;
      border: 1px solid #22c55e;
      color: #dcfce7;
      font-weight: bold;
    }
    .champion {
      background: #3b0764;
      border-color: #c084fc;
      color: #f3e8ff;
    }
    .prob-list { display: grid; gap: 9px; }
    .prob-row {
      display: grid;
      grid-template-columns: minmax(170px, 250px) 1fr 72px;
      gap: 10px;
      align-items: center;
    }
    .team-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: bold;
      min-width: 0;
    }
    .team-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 50%;
      padding: 3px;
      flex: 0 0 auto;
    }
    .bar-shell {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 999px;
      overflow: hidden;
      height: 17px;
    }
    .bar-fill {
      height: 100%;
      min-width: 1px;
      background: linear-gradient(90deg, #2563eb, #8b5cf6);
    }
    .pct { text-align: right; font-weight: bold; }
    .round-heading {
      margin: 28px 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .round-chip {
      border-radius: 999px;
      padding: 4px 9px;
      background: #312e81;
      border: 1px solid #818cf8;
      color: #e0e7ff;
      font-size: .82rem;
      font-weight: bold;
    }
    .series-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }
    .series-card.completed { border-color: #22c55e; }
    .series-card.active-series { border-color: #facc15; }
    .series-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .series-title { font-weight: 800; font-size: 1.05rem; }
    .series-sub { color: #94a3b8; font-size: .87rem; margin-top: 3px; }
    .status-chip {
      padding: 4px 8px;
      border-radius: 999px;
      background: #111827;
      border: 1px solid #475569;
      font-size: .78rem;
      font-weight: bold;
      white-space: nowrap;
    }
    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }
    .series-team {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 11px;
      min-width: 0;
    }
    .series-team.predicted { border-color: #22c55e; background: #052e1b; }
    .series-team .team-label { margin-bottom: 7px; }
    .series-prob { font-size: 1.45rem; font-weight: bold; }
    .seed { color: #94a3b8; font-size: .8rem; }
    .series-score {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 900;
      min-width: 60px;
    }
    .prediction-box {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 10px 12px;
      margin-bottom: 12px;
      line-height: 1.45;
    }
    .prediction-box strong { color: #86efac; }
    .games-table, .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .84rem;
      margin-top: 8px;
    }
    .games-table th, .games-table td,
    .history-table th, .history-table td {
      border: 1px solid #374151;
      padding: 7px 8px;
      text-align: left;
    }
    .games-table th, .history-table th { background: #111827; }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: #93c5fd; font-weight: bold; }
    .projection-history {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .history-item {
      border: 1px solid #334155;
      background: #111827;
      border-radius: 9px;
      padding: 10px;
    }
    .history-item .small { color: #94a3b8; font-size: .78rem; }
    .history-item .big { font-weight: bold; margin-top: 4px; }
    .muted { color: #94a3b8; }
    @media (max-width: 900px) {
      .series-grid { grid-template-columns: 1fr; }
      .projection-history { grid-template-columns: 1fr; }
      .prob-row { grid-template-columns: 1fr 1fr 60px; }
    }
    @media (max-width: 620px) {
      body { margin: 12px; }
      .teams { grid-template-columns: 1fr; }
      .series-score { order: -1; }
      .prob-row { grid-template-columns: 1fr; }
      .pct { text-align: left; }
    }
  </style>
</head>
<body>
  <a class="nav-link" href="../index.html">← Back to Home</a>

  <div class="topbar">
    <div>
      <h1 style="margin:0 0 5px;">MLB Postseason Mode</h1>
      <div class="muted" id="season-label">Loading postseason...</div>
    </div>
    <div class="tabs">
      <a class="tab" href="./index.html">All-Years</a>
      <a class="tab" href="./2021-plus.html">2021+</a>
      <a class="tab" href="./reward.html">Reward</a>
      <a class="tab" href="./comparison.html">Comparison</a>
      <a class="tab" href="./advanced.html">Savant Fusion</a>
      <a class="tab active" href="./postseason.html">Postseason</a>
    </div>
  </div>

  <div id="status" class="status">Loading...</div>
  <div id="inactive" class="inactive" style="display:none;"></div>

  <div id="postseason-content" style="display:none;">
    <div class="note" id="model-note"></div>

    <section class="overall-card">
      <div class="overall-header">
        <div>
          <h2 style="margin:0 0 6px;">Overall World Series Projection</h2>
          <div class="muted">Updates as postseason games are completed and series scores change.</div>
        </div>
        <div id="favorite-box" class="favorite"></div>
      </div>
      <div id="championship-probabilities" class="prob-list"></div>
      <div id="overall-history-wrap" style="margin-top:18px;"></div>
    </section>

    <div id="series-container"></div>
  </div>

  <script>
    const TEAM_LOGOS = {
      "Arizona Diamondbacks": "logos/arizona_diamondbacks.png",
      "Atlanta Braves": "logos/atlanta_braves.png",
      "Baltimore Orioles": "logos/baltimore_orioles.png",
      "Boston Red Sox": "logos/boston_red_sox.png",
      "Chicago Cubs": "logos/chicago_cubs.png",
      "Chicago White Sox": "logos/chicago_white_sox.png",
      "Cincinnati Reds": "logos/cincinnati_reds.png",
      "Cleveland Guardians": "logos/cleveland_guardians.png",
      "Colorado Rockies": "logos/colorado_rockies.png",
      "Detroit Tigers": "logos/detroit_tigers.png",
      "Houston Astros": "logos/houston_astros.png",
      "Kansas City Royals": "logos/kansas_city_royals.png",
      "Los Angeles Angels": "logos/los_angeles_angels.png",
      "Los Angeles Dodgers": "logos/los_angeles_dodgers.png",
      "Miami Marlins": "logos/miami_marlins.png",
      "Milwaukee Brewers": "logos/milwaukee_brewers.png",
      "Minnesota Twins": "logos/minnesota_twins.png",
      "New York Mets": "logos/new_york_mets.png",
      "New York Yankees": "logos/new_york_yankees.png",
      "Athletics": "logos/athletics.png",
      "Oakland Athletics": "logos/athletics.png",
      "Philadelphia Phillies": "logos/philadelphia_phillies.png",
      "Pittsburgh Pirates": "logos/pittsburgh_pirates.png",
      "San Diego Padres": "logos/san_diego_padres.png",
      "San Francisco Giants": "logos/san_francisco_giants.png",
      "Seattle Mariners": "logos/seattle_mariners.png",
      "St. Louis Cardinals": "logos/st_louis_cardinals.png",
      "Tampa Bay Rays": "logos/tampa_bay_rays.png",
      "Texas Rangers": "logos/texas_rangers.png",
      "Toronto Blue Jays": "logos/toronto_blue_jays.png",
      "Washington Nationals": "logos/washington_nationals.png"
    };

    function esc(v) {
      return String(v ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    function pct(v) {
      const n = Number(v);
      return Number.isFinite(n) ? `${(n * 100).toFixed(1)}%` : "—";
    }

    function logo(team) {
      const src = TEAM_LOGOS[team];
      return src ? `<img class="team-logo" src="${src}" alt="${esc(team)} logo">` : "";
    }

    function formatRecord(rec) {
      if (!rec || rec.wins === undefined) return "";
      return `${rec.wins}-${rec.losses}`;
    }

    function roundOrder(code) {
      return ({F:0,D:1,L:2,W:3})[code] ?? 99;
    }

    function renderOverall(state) {
      const probs = state.championship_probabilities || [];
      const favorite = state.world_series_favorite;
      const champion = state.world_series_champion;
      const box = document.getElementById("favorite-box");

      if (champion) {
        box.classList.add("champion");
        box.innerHTML = `🏆 ${esc(champion)} — World Series Champion`;
      } else if (favorite) {
        box.classList.remove("champion");
        box.innerHTML = `Projected champion: ${esc(favorite.team)} • ${pct(favorite.probability)}`;
      } else {
        box.textContent = "Overall projection unavailable";
      }

      document.getElementById("championship-probabilities").innerHTML = probs.map(row => `
        <div class="prob-row">
          <div class="team-label">
            ${logo(row.team)}
            <span>${row.seed ? `#${row.seed} ` : ""}${esc(row.team)} <span class="muted">${esc(row.league || "")}</span></span>
          </div>
          <div class="bar-shell"><div class="bar-fill" style="width:${Math.max(0.5, Number(row.probability || 0) * 100)}%"></div></div>
          <div class="pct">${pct(row.probability)}</div>
        </div>
      `).join("") || '<div class="muted">Championship probabilities are not available yet.</div>';

      const history = (state.overall_projection_history || []).slice(-9).reverse();
      document.getElementById("overall-history-wrap").innerHTML = history.length ? `
        <details>
          <summary>World Series projection history</summary>
          <div class="projection-history">
            ${history.map(item => `
              <div class="history-item">
                <div class="small">${esc(item.label)}</div>
                <div class="big">${esc(item.favorite)} • ${pct(item.probability)}</div>
              </div>
            `).join("")}
          </div>
        </details>
      ` : "";
    }

    function renderGames(series) {
      const games = series.games || [];
      if (!games.length) return "";
      return `
        <details>
          <summary>Games in series</summary>
          <table class="games-table">
            <thead><tr><th>Game</th><th>Matchup</th><th>Score</th><th>Status</th></tr></thead>
            <tbody>
              ${games.map((g, idx) => {
                const score = g.home_score !== null && g.home_score !== undefined && g.away_score !== null && g.away_score !== undefined
                  ? `${esc(g.away_team)} ${g.away_score} - ${g.home_score} ${esc(g.home_team)}`
                  : "—";
                return `<tr>
                  <td>${esc(g.game_number || idx + 1)}</td>
                  <td>${esc(g.away_team)} @ ${esc(g.home_team)}</td>
                  <td>${score}</td>
                  <td>${esc(g.status || "Scheduled")}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </details>
      `;
    }

    function renderPredictionHistory(series) {
      const history = series.prediction_history || [];
      if (!history.length) return "";
      return `
        <details>
          <summary>Series prediction after each game</summary>
          <table class="history-table">
            <thead><tr><th>Point</th><th>Series score</th><th>Predicted winner</th><th>Probability</th></tr></thead>
            <tbody>
              ${history.map(item => `<tr>
                <td>${esc(item.label)}</td>
                <td>${esc(item.series_score)}</td>
                <td>${esc(item.predicted_winner)}</td>
                <td>${pct(item.probability)}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </details>
      `;
    }

    function renderSeriesCard(series) {
      const aPred = series.predicted_series_winner === series.team_a ? "predicted" : "";
      const bPred = series.predicted_series_winner === series.team_b ? "predicted" : "";
      const cls = series.status === "completed" ? "completed" : series.status === "active" ? "active-series" : "";
      const statusText = series.status === "completed"
        ? `Winner: ${series.winner}`
        : series.status === "active"
          ? "Series in progress"
          : "Series upcoming";

      return `
        <article class="series-card ${cls}">
          <div class="series-top">
            <div>
              <div class="series-title">${esc(series.league)} ${esc(series.round_short)}</div>
              <div class="series-sub">Best of ${series.best_of} • ${statusText}</div>
            </div>
            <span class="status-chip">${series.wins_a}-${series.wins_b}</span>
          </div>

          <div class="teams">
            <div class="series-team ${aPred}">
              <div class="team-label">${logo(series.team_a)}<span>${series.team_a_seed ? `#${series.team_a_seed} ` : ""}${esc(series.team_a)}</span></div>
              <div class="series-prob">${pct(series.team_a_series_probability)}</div>
              <div class="seed">${formatRecord(series.team_a_record)}</div>
            </div>
            <div class="series-score">${series.wins_a}<br><span class="muted" style="font-size:.8rem;">SERIES</span><br>${series.wins_b}</div>
            <div class="series-team ${bPred}">
              <div class="team-label">${logo(series.team_b)}<span>${series.team_b_seed ? `#${series.team_b_seed} ` : ""}${esc(series.team_b)}</span></div>
              <div class="series-prob">${pct(series.team_b_series_probability)}</div>
              <div class="seed">${formatRecord(series.team_b_record)}</div>
            </div>
          </div>

          <div class="prediction-box">
            <strong>Series prediction:</strong> ${esc(series.predicted_series_winner)}
            (${pct(series.predicted_series_winner_probability)})
            ${series.winner ? `<br><span class="muted">Actual series winner: ${esc(series.winner)}</span>` : ""}
          </div>

          ${renderPredictionHistory(series)}
          ${renderGames(series)}
        </article>
      `;
    }

    function renderSeries(state) {
      const container = document.getElementById("series-container");
      const series = [...(state.series || [])].sort((a,b) => {
        const r = roundOrder(a.game_type) - roundOrder(b.game_type);
        if (r) return r;
        return String(a.league).localeCompare(String(b.league));
      });

      if (!series.length) {
        container.innerHTML = '<div class="note">Postseason series have not been populated yet.</div>';
        return;
      }

      const byRound = {};
      series.forEach(s => {
        if (!byRound[s.game_type]) byRound[s.game_type] = [];
        byRound[s.game_type].push(s);
      });

      container.innerHTML = ["F","D","L","W"].filter(code => byRound[code]).map(code => {
        const first = byRound[code][0];
        return `
          <div class="round-heading">
            <h2 style="margin:0;">${esc(first.round)}</h2>
            <span class="round-chip">AL + NL</span>
          </div>
          <div class="series-grid">${byRound[code].map(renderSeriesCard).join("")}</div>
        `;
      }).join("");
    }

    async function refresh() {
      const status = document.getElementById("status");
      try {
        const response = await fetch("./postseason_state.json?_=" + Date.now());
        if (!response.ok) throw new Error("postseason_state.json is not available yet");
        const state = await response.json();
        document.getElementById("season-label").textContent = `${state.season || ""} MLB Postseason`;

        if (!state.active) {
          document.getElementById("postseason-content").style.display = "none";
          const inactive = document.getElementById("inactive");
          inactive.style.display = "block";
          inactive.textContent = state.reason || "Postseason mode is currently inactive.";
          status.textContent = `Postseason mode inactive • checked ${new Date().toLocaleTimeString()}`;
          return;
        }

        document.getElementById("inactive").style.display = "none";
        document.getElementById("postseason-content").style.display = "block";
        document.getElementById("model-note").textContent = state.model_note || "";
        renderOverall(state);
        renderSeries(state);
        status.textContent = `Postseason projections updated • checked ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        status.textContent = `Postseason update failed: ${err.message}`;
      }
    }

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
